<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="60%" stop-color="#040609"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="amdRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#ED1C24"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b101c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#banBg)"/>

  <!-- High-Tech Geometric Grid Lines -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Left Monogram (180x180 scaled) -->
  <g transform="translate(130, 180)" filter="url(#glow)">
    <!-- Base Hex -->
    <path d="M 0,85 L 75,42 L 75,-6 L 0,36 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <path d="M 0,85 L -75,42 L -75,-6 L 0,36 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Middle Filter Gate (d3) -->
    <path d="M 0,42 L 68,6 L 0,-30 L -68,6 Z" fill="#0a0f1d" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <!-- Left Red Wing (AMD) -->
    <path d="M -55,-12 L 0,-42 L 0,-85 L -55,-55 Z" fill="url(#amdRedGrad)"/>
    <!-- Right Cyan Wing (Cloud Offload) -->
    <path d="M 0,-42 L 55,-12 L 55,-55 L 0,-85 Z" fill="url(#cyanGrad)"/>
    <!-- Top Crown Diamond -->
    <path d="M 0,-98 L 30,-80 L 0,-62 L -30,-80 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Active Pulse Rings -->
    <circle cx="-82" cy="-15" r="5" fill="#ED1C24"/>
    <circle cx="82" cy="-15" r="5" fill="#38BDF8"/>
    <circle cx="0" cy="70" r="4.5" fill="#10B981"/>
  </g>

  <!-- Title & Executive Taglines -->
  <g transform="translate(255, 105)">
    <!-- Badges Row -->
    <g transform="translate(0, -32)">
      <!-- AMD Badge -->
      <rect x="0" y="0" width="190" height="26" rx="6" fill="#1f1013" stroke="#ED1C24" stroke-width="1.2"/>
      <text x="10" y="17" fill="#ED1C24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">AMD TOKEN LAB</text>
      <text x="118" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CERTIFIED RC</text>

      <!-- Release Status Badge -->
      <rect x="202" y="0" width="148" height="26" rx="6" fill="#0c1a24" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="214" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">RELEASE CANDIDATE</text>
      <text x="318" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">v1.0</text>

      <!-- Architecture Badge -->
      <rect x="362" y="0" width="142" height="26" rx="6" fill="#0a1a14" stroke="#10B981" stroke-width="1.2"/>
      <text x="374" y="17" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ZERO-VRAM OFFLOAD</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="42" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="2">MEMORYOS</text>
    <text x="320" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="300"> // </text>
    <text x="355" y="42" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="1">THE QUIET ADVISOR</text>

    <!-- Subtitle -->
    <text x="0" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.4">
      Hardware-Aware AI Orchestration • Probabilistic d3 Frame Gating • Atomic NVMe Recovery
    </text>
    <text x="0" y="106" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Engineered for AMD Ryzen™ AI, ROCm™ &amp; AMD Instinct™ Compute Infrastructure
    </text>
  </g>

  <!-- Metrics Highlight Panel (Right Side) -->
  <g transform="translate(860, 52)">
    <rect width="300" height="256" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>

    <text x="20" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">VERIFIED PERFORMANCE PROFILE</text>

    <!-- Stat 1 -->
    <g transform="translate(20, 54)">
      <text x="0" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="20" font-weight="800">5.37 μs</text>
      <text x="96" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Speculative Offload MLP Speed</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(20, 102)">
      <text x="0" y="16" fill="#ED1C24" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="20" font-weight="800">0.091 ms</text>
      <text x="108" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">AMD Zen 3 CPU Gate (0.55% 60FPS)</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(20, 150)">
      <text x="0" y="16" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="20" font-weight="800">0 MB</text>
      <text x="68" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Local VRAM Sacrificed (100% Free)</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(20, 198)">
      <text x="0" y="16" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="20" font-weight="800">94.0%</text>
      <text x="78" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Hotspot Bandwidth Reduction</text>
    </g>
  </g>
</svg>