name: Deploy RJMedia Archive Website to GitHub Pages

on:
  push:
    branches: [ master, main ]
    paths:
      - 'memoryos/website/**'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Resolve website directory
        id: resolve_dir
        run: |
          if [ -d "memoryos/website" ]; then
            echo "site_dir=memoryos/website" >> $GITHUB_OUTPUT
          else
            echo "site_dir=website" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.resolve_dir.outputs.site_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
