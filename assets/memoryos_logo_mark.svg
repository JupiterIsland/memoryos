<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="amdRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#ED1C24"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED1C24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" filter="url(#dropShadow)"/>

  <!-- Subtle High-Tech Grid Accent -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Isometric Memory Core / Quantum Prism Monogram -->
  <g transform="translate(256, 240)" filter="url(#coreGlow)">
    <!-- Bottom Hex Base (Host Memory / NVMe Layer) -->
    <path d="M 0,140 L 120,70 L 120,-10 L 0,60 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2.5" opacity="0.9"/>
    <path d="M 0,140 L -120,70 L -120,-10 L 0,60 Z" fill="#090d16" stroke="#1e293b" stroke-width="2.5" opacity="0.9"/>

    <!-- Mid Layer (Quiet Advisor & d3 Probabilistic Gate) -->
    <path d="M 0,70 L 110,10 L 0,-50 L -110,10 Z" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="3.5" opacity="0.95"/>
    <line x1="0" y1="70" x2="0" y2="-50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Left Facet (AMD Radeon / ROCm & Token Lab Vector) -->
    <path d="M -90,-20 L 0,-70 L 0,-140 L -90,-90 Z" fill="url(#amdRed)" opacity="0.95"/>
    <path d="M -90,-20 L 0,30 L 0,-70 L -90,-120 Z" fill="#b91c1c" opacity="0.85"/>

    <!-- Right Facet (Inference Compute & Zero-VRAM Offload) -->
    <path d="M 0,-70 L 90,-20 L 90,-90 L 0,-140 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <path d="M 0,30 L 90,-20 L 90,-120 L 0,-70 Z" fill="#0369a1" opacity="0.85"/>

    <!-- Floating Top Diamond (MemoryOS Executive Crown) -->
    <path d="M 0,-160 L 50,-130 L 0,-100 L -50,-130 Z" fill="url(#platinumGrad)" stroke="#ffffff" stroke-width="2"/>

    <!-- Orbiting Neural Nodes -->
    <circle cx="-135" cy="-25" r="7" fill="#ED1C24"/>
    <line x1="-135" y1="-25" x2="-90" y2="-20" stroke="#ED1C24" stroke-width="2" stroke-dasharray="3 3"/>

    <circle cx="135" cy="-25" r="7" fill="#38BDF8"/>
    <line x1="135" y1="-25" x2="90" y2="-20" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3"/>

    <circle cx="0" cy="115" r="6" fill="#10B981"/>
    <line x1="0" y1="70" x2="0" y2="115" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- High-Tech Badge Label -->
  <g transform="translate(256, 436)" text-anchor="middle">
    <rect x="-120" y="-18" width="240" height="32" rx="16" fill="#090d16" stroke="url(#neonGlow)" stroke-width="1.5"/>
    <text x="0" y="4" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="800" letter-spacing="3.5">MEMORYOS</text>
  </g>
</svg>